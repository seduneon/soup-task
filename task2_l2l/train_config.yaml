# GRPO on Qwen3-4B under the 8 GB cap. Knobs mirror task1_budget/config.yaml (the predicted arm).
model: Qwen/Qwen3-4B
layers: null              # null = all 36; a smaller number truncates (debug only)
device: cuda
dtype: bfloat16
data_dir: data/countdown3/train   # Countdown-3 (prepare_countdown.py); was GSM8K
out_dir: runs/main
seed: 0

# memory plan (Part 1 re-run for Countdown-3: task1_budget/config_countdown.yaml -> 25 resident, 22 s/step)
resident: 25
n_buffers: 2
streaming: regular        # regular | dynamic (paged KV + residency follows free memory during decode)
profile_overlap: true     # CUDA events per layer copy / compute wait -> train_log "overlap" (off for timing A/B if it costs)
reward_shuffle: false     # Part 3 negative control run: true
cap_mib: 8192
cap_offset_mib: 0         # ballast footprint when a >8 GB card is capped with ballast.py (it prints the value)
strict_cap: false         # true: abort the run when a phase ends above the cap (device-wide used - offset)
reserve_mib: 512
headroom_mib: 400         # dynamic arm: transient per decode pass (logits, repeat_kv, page concat)
prefill_mb: 2
train_mb: 1
chunk: 256

# GRPO
prompts: 4                # B = 32; 17-token answers make the extra prompts cheap
G: 8
prompt_style: plain       # the Countdown prompt carries the full instruction; evaluate/verify need --prompt-style plain
max_new: 128              # Countdown-3 pilot: p90 18 tokens, 0.6 % truncated at 256
max_prompt: 96            # P of the memory plan (Countdown-3 prompts are <= 86 tokens); longer aborts
temperature: 1.0
top_p: 1.0
reward: countdown
adv_std: true
norm: seq                 # seq (GRPO) | token (DAPO)
beta: 0.0                 # KL to the reference; > 0 adds the ref log-prob pass
lr: 2.0e-5               # LoRA ~10x a full fine-tune GRPO lr (~1e-6..2e-6); tune on the first steps
clip: 1.0
lora_r: 16
lora_alpha: 32
steps: 100                # ~22 s/step predicted -> ~37 min
save_every: 1
